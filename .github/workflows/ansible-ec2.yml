name: Ansible deploy EC2

on:
  workflow_dispatch:
    inputs:
      roles:
        description: "Comma separated roles (example: minikube,docker,deployment)"
        required: true
        options:
          - minikube
          - docker
          - deployment
          - service
          - ingress
          - hpa
        default: "all"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show selected roles
        run: echo "Running roles - ${{ github.event.inputs.roles }}"

      - name: Check docker access
        run: |
          id
          groups
          docker ps
      - name: Run Ansible
        run: |
          pwd
          ls
          cd ansible/
          whoami
          ansible-playbook main.yml --tags "${{ github.event.inputs.roles }}" -i "localhost," --connection=local