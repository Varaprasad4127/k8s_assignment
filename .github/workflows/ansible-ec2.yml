name: Deploy K8s Assignment

on:
  workflow_dispatch:
    inputs:
      roles:
        description: "Comma separated roles (example: minikube,docker,deployment)"
        required: true
        default: "minikube"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Show selected roles
        run: echo "Running roles - ${{ github.event.inputs.roles }}"

      - name: Run Ansible
        run: |
          cd /home/ubuntu/k8s_assignment/ansible
          ansible-playbook -i inventory.ini main.yml --tags "${{ github.event.inputs.roles }}"