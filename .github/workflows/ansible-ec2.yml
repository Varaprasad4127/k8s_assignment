name: Ansible Deploy EC2
# run-name: Ansible run ${{ inputs.roles }}

on:
  workflow_dispatch:
    inputs:
      roles:
        description: "Comma separated roles (example: minikube,docker,deployment)"
        required: true
        type: choice
        options:
          - minikube
          - docker
          - deployment
          - service
          - ingress
          - hpa
        default: "all"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show selected roles
        run: echo "Running roles - ${{ github.event.inputs.roles }}"

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Debug image tag
        debug:
          msg: "Using image tag: {{ image_tag }}"

      - name: Run Ansible
        run: |
          pwd
          ls
          cd ansible/
          whoami
          ansible-playbook main.yml --tags "${{ github.event.inputs.roles }}" -i "localhost," --connection=local