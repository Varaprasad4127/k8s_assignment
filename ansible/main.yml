---
- name: EC2 Kubernetes Orchestration
  hosts: localhost
  connection: local
  gather_facts: yes
  become: yes
  become_user: ubuntu
  roles:
    - { role: minikube, tags: ['minikube'] }
    - { role: docker, tags: ['docker'] }
    - { role: deployment, tags: ['deployment'] }
    - { role: service, tags: ['service'] }
    - { role: ingress, tags: ['ingress'] }
    - { role: hpa, tags: ['hpa'] }