---
- name: Apply Service manifest
  k8s:
    kubeconfig: /home/ubuntu/.kube/config
    state: present
    src: "{{ playbook_dir }}/../k8s/service.yaml"
  become: yes
  become_user: ubuntu
  tags: service

- name: Enable Minikube ingress addon
  command: minikube addons enable ingress
  become: yes
  become_user: ubuntu
  tags: service