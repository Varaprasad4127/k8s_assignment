apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-app-ingress
  namespace: my-app
  annotations:
    kubernetes.io/ingress.class: "nginx"               # Make sure your cluster has nginx ingress installed
    nginx.ingress.kubernetes.io/rewrite-target: /      # Strip custom path before forwarding to service
spec:
  rules:
  - host: adbsafegate.helloworld.com                            # Replace with your domain or IP for testing
    http:
      paths:
      - path: /                              # Replace with the path you want
        pathType: Prefix
        backend:
          service:
            name: hello-app-service                          # Your existing ClusterIP service
            port:
              number: 80                               # The port exposed by your service